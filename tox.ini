[tox]
envlist = py312-django{42,52}, quality, docs
requires =
    tox-uv>=1

[doc8]
ignore = D001

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120
max-doc-length = 120

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: test-django42
    django52: test-django52
commands =
    python manage.py check
    pytest {posargs}

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups =
    doc
setenv =
    DJANGO_SETTINGS_MODULE = test_utils.test_settings
    PYTHONPATH = {toxinidir}
    # Adding the option here instead of as a default in the docs Makefile because that Makefile is generated by shpinx.
    SPHINXOPTS = -W
allowlist_externals =
    make
    rm
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/openedx_events.rst
    rm -f docs/modules.rst
    make -e -C docs clean
    make -e -C docs html
    python -m build --wheel
    twine check dist/*

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups =
    quality
allowlist_externals =
    make
    rm
    touch
commands =
    pylint openedx_events test_utils manage.py
    pycodestyle openedx_events manage.py
    ruff check openedx_events test_utils manage.py
    isort --check-only --diff test_utils openedx_events manage.py
    make selfcheck
